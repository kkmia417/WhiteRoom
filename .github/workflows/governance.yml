name: Governance

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".editorconfig"
      - ".gitattributes"
      - "docs/**"
      - "scripts/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "Assets/Scripts/**"
      - "Assets/Tests/**"
      - "Packages/com.kkmia.talksystem/**"
      - "ProjectSettings/**"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run governance tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate Windows and macOS repository compatibility
        run: python scripts/check_cross_platform.py --root .
      - name: Validate repository and PR traceability
        run: python scripts/validate_governance.py --root . --pr-event "${{ github.event_path }}"
